name: Build and publish Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;28.2.13676358
            cmake;3.31.6

      - name: Download and verify model
        run: scripts/fetch-model.sh

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare release files
        run: |
          mkdir -p "$RUNNER_TEMP/infinite-tokens-release"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/infinite-tokens-release/app-debug.apk"
          cd "$RUNNER_TEMP/infinite-tokens-release"
          sha256sum app-debug.apk > SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          First public version of the Android app.

          - Android 9+; supports `arm64-v8a` and `x86_64`.
          - SmolLM2-135M-Instruct Q4_K_M is bundled and runs locally on the device.
          - All visible model names use the same local model backend.
          - The small model can produce inaccurate answers, especially in Russian.

          The APK is debug-signed. SHA-256 is provided in `SHA256SUMS.txt`.
          EOF

      - name: Publish release and APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            "$RUNNER_TEMP/infinite-tokens-release/app-debug.apk" \
            "$RUNNER_TEMP/infinite-tokens-release/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Infinite Tokens 2026 $TAG" \
            --notes-file "$RUNNER_TEMP/infinite-tokens-release/release-notes.md" \
            --target "$GITHUB_SHA"
