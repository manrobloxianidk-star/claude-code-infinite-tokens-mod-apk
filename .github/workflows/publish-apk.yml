name: Build and publish Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;28.2.13676358
            cmake;3.31.6

      - name: Download and verify model
        run: scripts/fetch-model.sh

      - name: Run Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          disable-spellchecker: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare release files
        run: |
          mkdir -p "$RUNNER_TEMP/infinite-tokens-release"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/infinite-tokens-release/Claude.apk"
          cd "$RUNNER_TEMP/infinite-tokens-release"
          sha256sum Claude.apk > SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          Android app release.

          - Android 9+; supports `arm64-v8a` and `x86_64`.
          - Chat, projects, six Effort settings, and selectable model aliases.

          The APK is debug-signed. SHA-256 is provided in `SHA256SUMS.txt`.
          EOF

      - name: Publish release and APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'v0.1.1' }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$RUNNER_TEMP/infinite-tokens-release/Claude.apk" \
              "$RUNNER_TEMP/infinite-tokens-release/SHA256SUMS.txt" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release delete-asset "$TAG" app-debug.apk \
              --yes \
              --repo "$GITHUB_REPOSITORY" || true
          else
            gh release create "$TAG" \
              "$RUNNER_TEMP/infinite-tokens-release/Claude.apk" \
              "$RUNNER_TEMP/infinite-tokens-release/SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Infinite Tokens 2026 $TAG" \
              --notes-file "$RUNNER_TEMP/infinite-tokens-release/release-notes.md" \
              --target "$GITHUB_SHA"
          fi
